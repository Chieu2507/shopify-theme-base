<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared overlay regression fixture</title>
<link rel="stylesheet" href="../assets/critical.css">
<link rel="stylesheet" href="../assets/component-overlay.css">
<style>
  :root { font-size: 10px; --background-color: #fff; --body-color: #222; --heading-color: #222; --font-body-family: sans-serif; --font-body-size: 16px; --font-body-line-height: 1.5; --overlay-color: #000; --overlay-opacity: .4; --overlay-background-color: #fff; --overlay-text-color: #222; --overlay-border-color: #ddd; --overlay-drawer-padding-desktop: 30px; --overlay-popover-border-width: 1px; --overlay-popover-shadow: none; --overlay-backdrop-blur: 0px; --drawer-radius: 0px; --bottom-sheet-radius: 20px; --page-margin-mobile: 16px; --motion-duration-standard: 300ms; --motion-ease-standard: cubic-bezier(.22, 1, .36, 1); }
  body { font: 16px/1.5 sans-serif; min-height: 160vh; padding: 20px; }
  button { font: inherit; cursor: pointer; }
  .component-overlay__close { width: 40px; height: 40px; border: 0; background: transparent; }
  .component-overlay__body form { display: grid; gap: 16px; margin-top: 24px; }
  input { width: 100%; border: 1px solid #ccc; padding: 12px; }
  h2 { font: 24px/1.3 sans-serif; margin: 0; }
  .sticky { position: sticky; top: 20px; }
  output { display: block; white-space: pre-wrap; }
</style>
<div class="sticky">
  <h1>Shared overlay QA</h1>
  <button data-open="popup">Open popup</button>
  <button data-open="drawer">Open drawer</button>
  <button data-open="untitled">Open untitled</button>
  <output id="samples" aria-live="polite"></output>
</div>
<template id="shell">
  <dialog class="component-overlay" data-component-overlay data-state="closed" data-mobile-layout="bottom_sheet" scroll-lock aria-label="Test overlay">
    <header class="component-overlay__header">
      <span class="bottom-sheet__handle component-overlay__handle" aria-hidden="true"></span>
      <h2 class="component-overlay__title">Get notified when it's back</h2>
      <button class="component-overlay__close" data-overlay-close aria-label="Close">×</button>
    </header>
    <div class="component-overlay__body">
      <p>Leave your details and we'll let you know when this variant is available again.</p>
      <form method="dialog"><label>Email address<input type="email"></label><label>Phone number<input type="tel"></label><button>Done</button></form>
    </div>
  </dialog>
</template>
<script src="../assets/component-overlay.js"></script>
<script>
  for (const trigger of document.querySelectorAll('[data-open]')) {
    const dialog = document.querySelector('#shell').content.firstElementChild.cloneNode(true);
    dialog.id = trigger.dataset.open;
    dialog.dataset.desktopLayout = trigger.dataset.open === 'popup' ? 'popup' : 'drawer';
    if (trigger.dataset.open === 'untitled') {
      dialog.querySelector('header').classList.add('component-overlay__header--untitled');
      dialog.querySelector('h2').remove();
    }
    document.body.append(dialog);
    trigger.addEventListener('click', () => {
      ThemeOverlay.get(dialog).open({ opener: trigger });
      const values = [];
      const start = performance.now();
      const sample = () => {
        values.push({ ms: Math.round(performance.now() - start), transform: getComputedStyle(dialog).transform, opacity: getComputedStyle(dialog).opacity, backdrop: getComputedStyle(dialog, '::backdrop').opacity });
        if (performance.now() - start < 400) requestAnimationFrame(sample);
        else document.querySelector('#samples').textContent = JSON.stringify(values);
      };
      sample();
    });
  }
</script>
</html>
